---
- name: Manage Warehouse on localhost
  hosts: localhost
  gather_facts: true
  become: true

  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Install Warehouse
      ansible.builtin.include_role:
        name: jcook3701.flatpak.warehouse
