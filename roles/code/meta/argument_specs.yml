---
argument_specs:
  main:
    short_description: "Manages Code Flatpak installation."
    description: "This role manages the installation state of the
      Code Flatpak package."
    author: "Jared W. Cook"
    options:
      code_state:
        type: "str"
        required: false
        default: "present"
        choices: ["present", "absent", "teardown"]
        description: "The desired deployment state of the Code Flatpak package."
      code_package:
        type: "str"
        required: false
        default: "com.visualstudio.code"
        description: "The Flatpak application identifier for Code."
      code_remote_name:
        type: "str"
        required: false
        default: "flathub"
        description: "The name of the remote repository hosting the Code Flatpak package."
