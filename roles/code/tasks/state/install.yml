---
- name: Ensure Code Flatpak is installed
  community.general.flatpak:
    name: "{{ code_package | default('com.visualstudio.code') }}"
    state: "present"
    remote: "{{ code_remote_name | default('flathub') }}"
  when: ansible_facts.packages['flatpak'] is defined
