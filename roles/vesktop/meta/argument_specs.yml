---
argument_specs:
  main:
    short_description: "Manages the Vesktop Flatpak installation."
    description: "This role manages the installation state of the
      Vesktop Flatpak package."
    author: "Jared W. Cook"
    options:
      vesktop_state:
        type: "str"
        required: false
        default: "present"
        choices: ["present", "absent", "teardown"]
        description: "The desired deployment state of the vesktop Flatpak package."
      vesktop_package:
        type: "str"
        required: false
        default: "dev.vencord.Vesktop"
        description: "The Flatpak application identifier for Vesktop."
      vesktop_remote_name:
        type: "str"
        required: false
        default: "flathub"
        description: "The name of the remote repository hosting the Vesktop Flatpak package."
