---
- name: Ensure Vesktop Flatpak is installed
  community.general.flatpak:
    name: "{{ vesktop_package | default('dev.vencord.Vesktop') }}"
    state: "present"
    remote: "{{ vesktop_remote_name | default('flathub') }}"
  when: ansible_facts.packages['flatpak'] is defined
