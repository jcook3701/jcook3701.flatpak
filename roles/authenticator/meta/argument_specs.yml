---
argument_specs:
  main:
    short_description: "Manages Authenticator Flatpak installation."
    description: "This role manages the installation state of the
      Authenticator Flatpak package."
    author: "Jared W. Cook"
    options:
      authenticator_state:
        type: "str"
        required: false
        default: "present"
        choices: ["present", "absent", "teardown"]
        description: "The desired deployment state of the Authenticator Flatpak package."
      authenticator_package:
        type: "str"
        required: false
        default: "com.belmoussaoui.Authenticator"
        description: "The Flatpak application identifier for Authenticator."
      authenticator_remote_name:
        type: "str"
        required: false
        default: "flathub"
        description: "The name of the remote repository hosting the Authenticator Flatpak package."
