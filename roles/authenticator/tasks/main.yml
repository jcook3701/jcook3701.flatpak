---
- name: Gather target host package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Install Authenticator Flatpak
  ansible.builtin.include_tasks: state/install.yml
  when: authenticator_state | default('present') == 'present'

- name: Uninstall Authenticator Flatpak
  ansible.builtin.include_tasks: state/uninstall.yml
  when: authenticator_state | default('present') in ['absent', 'teardown']
