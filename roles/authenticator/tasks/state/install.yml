---
- name: Ensure Authenticator flatpak is installed
  community.general.flatpak:
    name: "{{ authenticator_package | default('com.belmoussaoui.Authenticator') }}"
    state: "present"
    remote: "{{ authenticator_remote_name | default('flathub') }}"
  when: ansible_facts.packages['flatpak'] is defined
