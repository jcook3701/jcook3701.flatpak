---
- name: Ensure Flatseal Flatpak is installed
  community.general.flatpak:
    name: "{{ flatseal_package | default('com.github.tchx84.Flatseal') }}"
    state: "present"
    remote: "{{ flatseal_remote_name | default('flathub') }}"
  when: ansible_facts.packages['flatpak'] is defined
