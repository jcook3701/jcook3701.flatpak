---
- name: Ensure iDescriptor Flatpak is uninstalled
  community.general.flatpak:
    name: "{{ idescriptor_package | default('io.github.idescriptor.iDescriptor') }}"
    state: "absent"
    remote: "{{ idescriptor_remote_name | default('flathub') }}"
  when: ansible_facts.packages['flatpak'] is defined
