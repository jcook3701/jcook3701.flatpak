---
argument_specs:
  main:
    short_description: "Manages iDescriptor Flatpak installation."
    description: "This role manages the installation state of the
      iDescriptor Flatpak package."
    author: "Jared W. Cook"
    options:
      idescriptor_state:
        type: "str"
        required: false
        default: "present"
        choices: ["present", "absent", "teardown"]
        description: "The desired deployment state of the iDescriptor Flatpak package."
      idescriptor_package:
        type: "str"
        required: false
        default: "io.github.idescriptor.iDescriptor"
        description: "The Flatpak application identifier for iDescriptor."
      idescriptor_remote_name:
        type: "str"
        required: false
        default: "flathub"
        description: "The name of the remote repository hosting the iDescriptor Flatpak package."
