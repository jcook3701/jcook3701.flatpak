---
argument_specs:
  main:
    short_description: "Manages Github Desktop Flatpak installation."
    description: "This role manages the installation state of the
      Github Desktop Flatpak package."
    author: "Jared W. Cook"
    options:
      github_desktop_state:
        type: "str"
        required: false
        default: "present"
        choices: ["present", "absent", "teardown"]
        description: "The desired deployment state of the GitHub Desktop Flatpak package."
      github_desktop_package:
        type: "str"
        required: false
        default: "io.github.shiftey.Desktop"
        description: "The Flatpak application identifier for GitHub Desktop."
      github_desktop_remote_name:
        type: "str"
        required: false
        default: "flathub"
        description: "The name of the remote repository hosting the GitHub Desktop Flatpak package."
