---
- name: Gather target host package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Ensure Github-Desktop Flatpak is installed
  ansible.builtin.include_tasks: state/install.yml
  when: github_desktop_state | default('present') == 'present'

- name: Ensure Github-Desktop Flatpak is uninstalled
  ansible.builtin.include_tasks: state/uninstall.yml
  when: github_desktop_state | default('present') in ['absent', 'teardown']
