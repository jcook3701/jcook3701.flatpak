---
- name: Ensure Github-Desktop Flatpak is uninstalled
  community.general.flatpak:
    name: "{{ github_desktop_package | default('io.github.shiftey.Desktop') }}"
    state: "absent"
    remote: "{{ github_desktop_remote_name | default('flathub') }}"
  when: ansible_facts.packages['flatpak'] is defined
