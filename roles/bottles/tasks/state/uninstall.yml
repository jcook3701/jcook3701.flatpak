---
- name: Ensure Bottles flatpak is uninstalled
  community.general.flatpak:
    name: "{{ bottles_package | default('com.usebottles.bottles') }}"
    state: "absent"
    remote: "{{ bottles_remote_name | default('flathub') }}"
  when: ansible_facts.packages['flatpak'] is defined
