---
- name: Ensure Deskflow flatpak is uninstalled
  community.general.flatpak:
    name: "{{ deskflow_package | default('org.deskflow.deskflow') }}"
    state: "absent"
    remote: "{{ deskflow_remote_name | default('flathub') }}"
  when: ansible_facts.packages['flatpak'] is defined
