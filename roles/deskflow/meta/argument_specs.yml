---
argument_specs:
  main:
    short_description: "Manages the Deskflow Flatpak installation."
    description: "This role manages the installation state of the
      Deskflow Flatpak package."
    author: "Jared W. Cook"
    options:
      deskflow_state:
        type: "str"
        required: false
        default: "present"
        choices: ["present", "absent", "teardown"]
        description: "The desired deployment state of the Deskflow Flatpak package."
      deskflow_package:
        type: "str"
        required: false
        default: "org.deskflow.deskflow"
        description: "The Flatpak application identifier for Deskflow."
      deskflow_remote_name:
        type: "str"
        required: false
        default: "flathub"
        description: "The name of the remote repository hosting the Deskflow Flatpak package."
