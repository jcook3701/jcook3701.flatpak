---
argument_specs:
  main:
    short_description: "Manages the Discord Flatpak installation."
    description: "This role manages the installation state of the
      Discord Flatpak package."
    author: "Jared W. Cook"
    options:
      discord_state:
        type: "str"
        required: false
        default: "present"
        choices: ["present", "absent", "teardown"]
        description: "The desired deployment state of the Discord Flatpak package."
      discord_package:
        type: "str"
        required: false
        default: "org.discordapp.Discord"
        description: "The Flatpak application identifier for Discord."
      discord_remote_name:
        type: "str"
        required: false
        default: "flathub"
        description: "The name of the remote repository hosting the Discord Flatpak package."
