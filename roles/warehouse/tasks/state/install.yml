---
- name: Ensure Warehouse Flatpak is installed
  community.general.flatpak:
    name: "{{ warehouse_package | default('io.github.flattool.Warehouse') }}"
    state: "present"
    remote: "{{ warehouse_remote_name | default('flathub') }}"
  when: ansible_facts.packages['flatpak'] is defined
