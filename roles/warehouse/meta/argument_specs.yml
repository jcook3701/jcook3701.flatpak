---
argument_specs:
  main:
    short_description: "Manages the Warehouse Flatpak installation."
    description: "This role manages the installation state of the
      Warehouse Flatpak package."
    author: "Jared W. Cook"
    options:
      warehouse_state:
        type: "str"
        required: false
        default: "present"
        choices: ["present", "absent", "teardown"]
        description: "The desired deployment state of the Warehouse Flatpak package."
      warehouse_package:
        type: "str"
        required: false
        default: "io.github.flattool.Warehouse"
        description: "The Flatpak application identifier for Warehouse."
      warehouse_remote_name:
        type: "str"
        required: false
        default: "flathub"
        description: "The name of the remote repository hosting the Warehouse Flatpak package."
